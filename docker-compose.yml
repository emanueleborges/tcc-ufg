services:
  backend:
    build:
      context: ./backend
    container_name: tcc-ufg-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/validacoes:/app/validacoes
      - ./backend/indice_juridico:/app/indice_juridico
      - ./backend/downloads_peticoes:/app/downloads_peticoes
      - ./backend/relatorios:/app/relatorios
      - huggingface_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: tcc-ufg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
